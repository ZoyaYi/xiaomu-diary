function care(s){return `<section class="panel care-focus"><div class="section-top"><div><h2>别忘了，驱虫这件小事</h2><p class="chart-note">提前 ${state.care?.leadDays??3} 天在这里提示</p></div><button class="text-button" data-care>设置提醒 ↗</button></div><div class="care-plans">${[['internal','体内',s.lastInternal],['external','体外',s.lastExternal]].map(([key,label,last])=>{const plan=state.care?.[key],rem=s.reminders.find(r=>r.scope===label||r.scope==='内外同驱');return `<button class="care-plan ${rem?.overdue?'is-overdue':''}" data-care><span class="mini-badge ${key==='external'?'blue':''}">${label.slice(1)}</span><div><strong>${label}驱虫</strong><p>${plan?.product?esc(plan.product):'药品待补充'}</p><span class="last-care">上次 ${last?last.date.replaceAll('-','.'):'未记录'}</span></div><div class="care-next"><b>${rem?rem.nextDate.slice(5).replace('-','.'):'待设置'}</b><small>${rem?(rem.overdue?'已过 '+Math.abs(rem.daysUntil)+' 天':rem.daysUntil===0?'今天记得驱虫':'还有 '+rem.daysUntil+' 天'):'填写下次日期'}</small></div></button>`;}).join('')}</div><div class="care-actions"><button data-add="deworm" class="text-button">＋ 记录已完成驱虫</button><button id="calendar-export" class="text-button">加入手机日历 ↗</button></div><p class="chart-note">关掉页面后的提醒由手机日历负责；微信推送尚未开通。</p></section>`;}

if(key==='home'){
html=`<section class="mu-hero"><div class="hero-spots" aria-hidden="true"></div><div class="hero-copy"><span class="blue-label">小豹猫妹妹 ${paw}</span><h1>${esc(p.name)}<span>的成长日记</span></h1><p>今天也要开心长大</p><div class="hero-tags"><span>🎂 ${esc(p.birthday.replaceAll('-','.'))}</span><span>来家里 ${s.arrivalDays??'—'} 天啦 ♡</span></div><button class="text-button" data-profile>关于小μ的小档案 ↗</button></div>${photoCarousel()}<span class="hero-paw">${paw}</span></section>

<div class="content-grid"><section class="panel chart-panel"><div class="section-top"><div><h2>一点点长大的证据</h2><p class="chart-note">${s.weights.length} 次称重 · 体重变化 / kg</p></div><button class="text-button" data-filter-link="weight">全部 ↗</button></div>${chart(s)}<p class="growth-note">${s.delta===null?'记下体重，留住长大的每一步。':'比上次'+(s.delta>=0?'重':'轻')+'了 '+Math.abs(s.delta*1000).toFixed(0)+' g，继续慢慢长大 ♡'}</p></section><section class="panel health-entry"><span class="health-symbol">♡</span><h2>生病时，记在这里</h2><p class="chart-note">症状、就诊、用药和恢复过程，都有地方保存。</p><button class="primary" data-add="illness">＋ 记录生病情况</button><button class="text-button" data-filter-link="illness">查看生病记录 ↗</button></section></div>
<section class="outing-banner"><div class="outing-paw">${paw}</div><div><h2>一起出去看世界</h2><p>${s.lastOuting?'上次的小冒险是 '+s.lastOuting.date.replaceAll('-','.')+'，周'+['日','一','二','三','四','五','六'][new Date(s.lastOuting.date+'T12:00:00').getDay()]+'出去玩啦。':'下一次，会在哪里留下小脚印呢？'}</p></div><button class="primary" data-add="outing">＋ 记一次出游</button></section>
<section class="photo-section"><div class="section-top"><h2>小μ的可爱瞬间 <span>♡</span></h2><span class="muted small">每一张都是她</span></div><div class="photo-strip">${(state.photos||[]).slice(0,3).map(p=>`<button data-album-id="${esc(p.id)}" class="moment"><img src="${esc(photoURL(p))}" alt="小μ的照片" loading="lazy"/><span>${esc(p.caption)}</span></button>`).join('')}</div></section><section class="records-section"><div class="section-top"><h2>最近的小日子</h2><a class="text-button" href="#records">翻翻记录本 ↗</a></div>${recordList(M.sort(state.records).slice(0,4))}</section>`;
}else if(key==='records'){
html=heading('小μ的记录本','长大的每一页，都在这里。')+`<div class="filters"><button data-filter="all" class="${filter==='all'?'active':''}">全部</button>${M.TYPES.filter(t=>M.activeTypes(state).some(a=>a.id===t.id)||state.records.some(r=>r.type===t.id)).map(t=>`<button data-filter="${t.id}" class="${filter===t.id?'active':''}">${t.name}</button>`).join('')}</div>${filter==='weight'?`<section class="panel">${chart(s)}</section>`:''}${recordList(state.records.filter(r=>filter==='all'||r.type===filter))}`;
}else if(key==='outings'){
html=heading('小μ的小脚印','和小μ一起，把普通日子过成小冒险。','outing')+`<section class="outing-intro"><img src="${assets}mu-play.jpg" alt="准备玩耍的小μ"/><div><span class="blue-label">OUT & ABOUT</span><h2>${s.lastOuting?'最近一次：'+s.lastOuting.date.slice(5).replace('-','.'):'下一站，去哪里？'}</h2><p>${s.lastOuting?'距今 '+s.daysSinceOuting+' 天 · 已记录 '+state.records.filter(r=>r.type==='outing').length+' 次外出':'记录出去玩的日期，也可以留下一句话。'}</p></div></section><section class="panel">${calendar()}</section><div class="section-top"><h2>去玩的小日子</h2></div>${recordList(state.records.filter(r=>r.type==='outing'))}`;
}else if(key==='food'){
const last=M.sort(state.records.filter(r=>r.type==='food'))[0];html=heading('吃饭小本本','好好吃饭，好好长大。','meal')+`<div class="content-grid"><section class="panel"><div class="section-top"><h2>今天的饭</h2><span class="blue-label">${M.today().slice(5).replace('-','.')}</span></div><div class="food-stats"><div><p>实际吃掉</p><strong>${s.eatenCount?s.eaten:'—'}</strong> g</div><div><p>今天已经喂了</p><strong>${s.fedCount?s.fed:'—'}</strong> g</div></div><p class="chart-note">只记份量，不记录食物品牌。出粮和实吃分开统计。</p><button class="primary" data-add="meal">＋ 记录一餐</button></section><section class="panel"><div class="section-top"><h2>换粮小记</h2><button class="text-button" data-add="food">＋ 记录</button></div>${last?`<p>${esc(M.describe(last))}</p><p class="muted">${esc(last.date)} · ${esc(last.note||'暂无适应情况备注')}</p>`:'<div class="empty">记一下新粮占比，<br>和她适应得怎么样。</div>'}<p class="chart-note">不用填写品牌和粮名。</p></section></div><section class="panel feeder"><div class="section-top"><h2>喜瓜投喂</h2><span class="blue-label">尚未连接</span></div><p class="muted">可以先手动记。自动同步仍需确认设备型号和厂商接口。</p><div class="quick inline"><button id="import-csv">导入 CSV</button><button id="template">下载模板</button></div></section><section class="records-section"><h2>吃饭与换粮记录</h2>${recordList(state.records.filter(r=>['meal','food'].includes(r.type)))}</section>`;
}else if(key==='profile'){
html=heading('关于小μ','一只被好好爱着的小豹猫。')+`<section class="panel profile-card"><img src="${assets}mu-avatar.jpg" alt="小μ"/><div><h2>${esc(p.name)} <span class="blue-text">♀</span></h2><p>${esc(p.breed)} · ${esc(s.age)}</p><p>生日 ${esc(p.birthday.replaceAll('-','.'))}</p></div><button class="text-button" data-profile>编辑 ↗</button></section><section class="panel family-panel"><h2>你和家人，一起记</h2><p class="chart-note">${window.MuCloud?.enabled===false?'此网页版的记录保存在当前设备。家人可以打开同一网址，但暂不共用记录。':window.MuCloud?.token?'已使用家庭共享，联网时自动同步。':'创建专属链接，发给弟弟就能打开同一本日记。'}</p><button class="primary" id="family-share" ${window.MuCloud?.enabled===false?'disabled':''}>${window.MuCloud?.enabled===false?'家庭同步尚未配置':window.MuCloud?.token?'复制家庭链接':'创建免登录家庭链接'}</button><p class="chart-note">${window.MuCloud?.enabled===false?'需要另外配置共享服务后，才能和家人一起修改同一本日记。':'拿到专属链接的家人都能查看、添加和修改，无需注册登录。'}</p><span class="tag">${esc(syncLabel)}</span></section><section class="panel"><div class="section-top"><h2>想记哪些小事？</h2></div><p class="chart-note">关掉不需要的项目，首页和新增入口就会收起来。已有记录仍保留，可单独删除。</p><div class="type-toggles">${M.TYPES.map(t=>{const on=M.activeTypes(state).some(x=>x.id===t.id);return `<button class="type-toggle ${on?'on':''}" data-toggle-type="${t.id}" role="switch" aria-checked="${on}" aria-label="${t.name}记录"><span>${icon(t.id)} ${t.name}</span><i></i></button>`;}).join('')}</div></section><section class="panel"><h2>把小日子好好保存</h2><div class="settings-row"><div><h3>完整备份</h3><p>保存在当前设备，记得定期导出。</p></div><button class="secondary" id="export">导出备份</button></div><div class="settings-row"><div><h3>恢复备份</h3><p>选择之前导出的 JSON 文件。</p></div><button class="secondary" id="restore">恢复</button></div>${state.trash?.length?`<div class="settings-row"><div><h3>最近删除</h3><p>${state.trash.length} 条记录可恢复。</p></div><button class="secondary" id="undo-delete">恢复上一条</button></div>`:''}</section><p class="chart-note">喜瓜 · 尚未连接自动同步。驱虫下次日期只在打开时提示。</p>`;
}
$('#content').innerHTML=(loadError?`<div class="note overdue">${esc(loadError)} <button id="raw-export">导出原始备份</button></div>`:'')+html+`<p class="footer-note">${paw} 小μ的成长日记 · 每一个小日子都算数<br>${esc(syncLabel)} · ${state.records.length} 条记录</p>`;
}
function field(name,label,value='',type='text',hint=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any" min="0"':''} ${type==='date'&&!['nextDate','internalNextDate','externalNextDate'].includes(name)?'max="'+M.today()+'"':''}><small>${hint}</small></label>`;}
function select(name,label,options,value){return `<label class="field">${label}<select name="${name}">${options.map(o=>{const k=Array.isArray(o)?o[0]:o,v=Array.isArray(o)?o[1]:o;return `<option value="${esc(k)}" ${k===value?'selected':''}>${esc(v)}</option>`;}).join('')}</select></label>`;}
function recordFields(type,r){let fields=select('type','记录类型',M.TYPES.filter(t=>M.activeTypes(state).some(a=>a.id===t.id)||type===t.id).map(t=>[t.id,t.name]),type)+`<div class="field-row">${field('date','日期',r.date||M.today(),'date')}${field('time','时间（可选）',r.time||'','time')}</div>`;
if(type==='weight')fields+=field('value','体重 / kg',r.value??'','number','请填写实际称量值。');
if(type==='meal')fields+=select('mealKind','这笔数据是什么', [['fed','手动投喂'],['dispensed','投喂器出粮'],['eaten','实际吃掉']],r.mealKind||'fed')+field('value','重量 / g',r.value??'','number')+select('foodType','食物类型',['干粮','湿粮','零食','其他'],r.foodType||'干粮');
if(type==='deworm')fields+=select('scope','驱虫范围',['内外同驱','体内','体外'],r.scope||'内外同驱')+field('product','药品名称（可选）',r.product||'')+field('dose','已用规格／剂量（可选）',r.dose||'','text','只记录实际用量，不提供剂量计算。')+field('nextDate','下次日期（可选）',r.nextDate||'','date','依据具体药品说明或兽医建议填写。');
if(type==='illness')fields+=field('symptoms','观察到的症状',r.symptoms||'')+select('status','目前情况',['观察中','已就诊','已康复'],r.status||'观察中')+field('treatment','就诊／用药（可选）',r.treatment||'');
if(type==='food')fields+=field('ratio','本次新粮占比 / %',r.ratio??'','number');
if(type==='outing')fields+=field('place','去了哪里（可选）',r.place||'')+field('duration','玩了多久 / 分钟（可选）',r.duration??'','number');
if(type==='health')fields+=select('category','健康事项',['疫苗','就诊','用药','绝育','发情','体检','其他'],r.category||'疫苗')+field('title','名称／事项',r.title||'')+field('nextDate','下次日期（可选）',r.nextDate||'','date');
if(type==='daily')fields+=select('category','日常事项',['便便','呕吐','食欲','外出','洗护','零食试吃','其他'],r.category||'便便')+field('title','简短描述',r.title||'');
return fields+`<label class="field">备注<textarea name="note">${esc(r.note||'')}</textarea></label>`;}
function openEditor(type='',id){if(!type&&!id&&!M.activeTypes(state).length){toast('先在档案里启用想记录的项目吧');return;}mode='record';editing=id?state.records.find(r=>r.id===id):null;const r=editing||{};$('#editor-title').textContent=editing?'编辑记录':'记一笔';$('#form-fields').innerHTML=recordFields(r.type||type||M.activeTypes(state)[0]?.id||'weight',r);$('#form-error').textContent='';$('#delete-record').hidden=!editing;$('#editor').showModal();}
function openProfile(){mode='profile';editing=null;const p=state.profile;$('#editor-title').textContent='小μ的档案';$('#form-fields').innerHTML=field('name','名字',p.name)+field('birthday','生日',p.birthday,'date')+field('arrival','到家日期',p.arrival||'','date')+field('breed','品种',p.breed)+select('sex','性别',['母','公'],p.sex)+field('feeder','投喂 App／设备型号',p.feeder)+`<div class="note">生日已按你提供的记录填写，月龄会自动更新。</div>`;$('#form-error').textContent='';$('#delete-record').hidden=true;$('#editor').showModal();}
function confirmation(title,html,action){$('#confirm-title').textContent=title;$('#confirm-body').innerHTML=html;pending=action;$('#confirm').showModal();}
function download(name,contents,type='application/json'){const u=URL.createObjectURL(new Blob([contents],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
$('#record-form').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const next=mode==='care'?M.setCare(state,{internal:{product:data.internalProduct,nextDate:data.internalNextDate},external:{product:data.externalProduct,nextDate:data.externalNextDate},leadDays:data.leadDays}):mode==='profile'?M.profile(state,data):M.save(state,{...data,...(editing?{id:editing.id,source:editing.source}:{})});if(!commit(next))return;$('#editor').close();render();toast('已经记好了');}catch(err){$('#form-error').textContent=err.message;}});
$('#form-fields').addEventListener('change',e=>{if(e.target.name==='type'){const r=Object.fromEntries(new FormData($('#record-form')));$('#form-fields').innerHTML=recordFields(e.target.value,{date:r.date,time:r.time,note:r.note});$('#form-error').textContent='';}});
$('#delete-record').onclick=()=>{if(!editing)return;const id=editing.id;confirmation('删除这条记录？','从记录本移除，之后可在档案里恢复。',()=>{if(commit(M.remove(state,id))){$('#editor').close();render();toast('记录已删除');}});};
$('#close-editor').onclick=()=>$('#editor').close();$('#close-confirm').onclick=()=>$('#confirm').close();$('#confirm-action').onclick=()=>{const action=pending;pending=null;$('#confirm').close();if(action)action();};$('#mobile-add').onclick=()=>openEditor(location.hash==='#food'?'meal':location.hash==='#outings'?'outing':M.activeTypes(state)[0]?.id||'weight');$('#backup-short').onclick=()=>download('小μ备份-'+M.today()+'.json',JSON.stringify(state,null,2));
document.addEventListener('click',e=>{const extra=e.target.closest('[data-toggle-type],[data-filter-link],[data-day],[data-month],[data-photo]');if(extra){if(extra.hasAttribute('data-toggle-type')){if(commit(M.toggleType(state,extra.dataset.toggleType)))render();}else if(extra.hasAttribute('data-filter-link')){filter=extra.dataset.filterLink;location.hash='records';render();}else if(extra.hasAttribute('data-day')){const r=state.records.find(r=>r.type==='outing'&&r.date===extra.dataset.day);openEditor('outing',r?.id);if(!r)$('#record-form [name=date]').value=extra.dataset.day;}else if(extra.hasAttribute('data-month')){const [y,m]=calendarMonth.split('-').map(Number),d=new Date(y,m-1+Number(extra.dataset.month),1);calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render();}else{confirmation('小μ的可爱瞬间',`<img class="lightbox" src="${assets+esc(extra.dataset.photo)}" alt="小μ的照片"/>`,()=>{});}return;}const a=e.target.closest('[data-add],[data-profile],[data-edit],[data-filter]');if(a){if(a.hasAttribute('data-add'))openEditor(a.dataset.add);else if(a.hasAttribute('data-profile'))openProfile();else if(a.hasAttribute('data-edit'))openEditor(null,a.dataset.edit);else {filter=a.dataset.filter;render();}return;}switch(e.target.id){case'undo-delete':if(commit(M.undo(state))){render();toast('已经放回记录本');}break;case'export':download('小μ备份-'+M.today()+'.json',JSON.stringify(state,null,2));break;case'raw-export':download('小μ原始备份.json',localStorage.getItem(KEY)||'');break;case'restore':$('#backup-file').click();break;case'import-csv':$('#csv-file').click();break;case'template':download('喂食导入模板.csv','\uFEFFdate,time,grams,kind\n'+M.today()+',08:00,10,dispensed\n','text/csv;charset=utf-8');break;}});
$('#backup-file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>5e6)throw new Error('备份文件超过5MB');const next=M.restore(await file.text());confirmation('恢复这份备份？',`将用 ${esc(next.profile.name)} 的 <b>${next.records.length}</b> 条记录替换当前 <b>${state.records.length}</b> 条记录。请先确认已备份当前数据。`,()=>{if(commit(next)){render();toast('备份已恢复');}});}catch(err){toast('无法恢复：'+err.message);}};
$('#csv-file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>1e6)throw new Error('CSV超过1MB');const text=await file.text(),rs=M.parseCSV(text),result=M.importMeals(state,text);confirmation('确认导入喂食记录',`共 ${rs.length} 条，将新增 ${result.added} 条；其余为重复记录。<table class="preview-table">${rs.slice(0,5).map(r=>`<tr><td>${esc(r.date)} ${esc(r.time)}</td><td>${esc(M.describe(r))}</td></tr>`).join('')}</table>`,()=>{if(commit(M.importMeals(state,text).state)){render();toast('导入完成');}});}catch(err){toast('导入失败：'+err.message);}};
window.addEventListener('hashchange',render);render();
window.MuCloud?.start(next=>{state=M.migrate(M.restore(next));KEY=window.MuCloud.storageKey;localStorage.setItem(KEY,JSON.stringify(state));render();if($('#album-editor').open)renderAlbum();},status=>{syncLabel=status;const label=$('#sync-status');if(label)label.textContent=status;});
function openCare(){mode='care';editing=null;const c=state.care||M.defaultCare();$('#editor-title').textContent='设置驱虫提醒';$('#form-fields').innerHTML=field('internalProduct','内驱药',c.internal.product)+field('internalNextDate','下次内驱日期',c.internal.nextDate,'date')+field('externalProduct','外驱药',c.external.product)+field('externalNextDate','下次外驱日期',c.external.nextDate,'date')+field('leadDays','提前几天提示',c.leadDays,'number')+'<p class="note">日期按包装或兽医建议填写。幼猫片1颗是你提供的历史资料，下次用量请按现体重重新核对。</p>';$('#form-error').textContent='';$('#delete-record').hidden=true;$('#editor').showModal();}
function renderAlbum(){const ps=state.photos||[];albumIndex=Math.max(0,Math.min(albumIndex,ps.length-1));const p=ps[albumIndex];$('#album-content').innerHTML=(p?`<div class="album-view"><img src="${esc(photoURL(p))}" alt="小μ的照片"/><button data-album-step="-1" aria-label="上一张照片">‹</button><button data-album-step="1" aria-label="下一张照片">›</button></div><p>${albumIndex+1} / ${ps.length}</p>`:'<p>相册还空着，添加一张照片吧。</p>')+`<div class="album-actions"><button class="primary" data-upload-photo>＋ 上传照片</button>${p?`<button class="danger" data-delete-photo="${esc(p.id)}">删除这张</button>`:''}${state.photoTrash?.length?'<button data-undo-photo>恢复上一张</button>':''}</div>`;}
function openAlbum(id){albumIndex=Math.max(0,(state.photos||[]).findIndex(p=>p.id===id));renderAlbum();$('#album-editor').showModal();}
async function compressPhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('请选择JPG、PNG或WebP');if(file.size>20000000)throw Error('照片请小于20MB');const image=new Image(),url=URL.createObjectURL(file);try{await new Promise((ok,fail)=>{image.onload=ok;image.onerror=()=>fail(Error('照片无法读取'));image.src=url;});const c=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(image.naturalWidth,image.naturalHeight));c.width=Math.round(image.naturalWidth*scale);c.height=Math.round(image.naturalHeight*scale);c.getContext('2d').drawImage(image,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7);}finally{URL.revokeObjectURL(url);}}
async function uploadPhotos(files){try{if((state.photos||[]).length+files.length>40)throw Error('最多保存40张照片');toast('正在整理照片…');const photos=[];for(const file of files){const src=await compressPhoto(file);photos.push(window.MuCloud?.token?await window.MuCloud.upload(await(await fetch(src)).blob()):{id:'photo-'+crypto.randomUUID(),src,caption:'小μ的可爱瞬间'});}if(commit(M.addPhotos(state,photos))){albumIndex=state.photos.length-1;render();renderAlbum();toast('照片已保存');}}catch(e){toast(e.message);}}
async function familyShare(){try{const url=await window.MuCloud.share(state);KEY=window.MuCloud.storageKey;localStorage.setItem(KEY,JSON.stringify(state));render();confirmation('发给家人，一起记',`<p>拿到链接就能查看和编辑，无需注册登录。</p><input class="share-link" readonly value="${esc(url)}" aria-label="家庭共享链接">`,async()=>{try{await navigator.clipboard.writeText(url);toast('家庭链接已复制');}catch{toast('请选中链接手动复制');}});$('#confirm-action').textContent='复制链接';}catch(e){toast(e.message||'共享服务暂不可用');}}
function exportCalendar(){const rs=M.summary(state).reminders.filter(r=>r.nextDate>=M.today());if(!rs.length){toast('请先设置未来的下次日期');openCare();return;}const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mu Diary//Care//ZH','CALSCALE:GREGORIAN'];for(const r of rs){const d=r.nextDate.replaceAll('-','');lines.push('BEGIN:VEVENT','UID:mu-'+r.scope+'-'+d+'@mu-diary','DTSTAMP:'+new Date().toISOString().replace(/[-:]|\.\d{3}/g,''),'DTSTART:'+d+'T010000Z','DTEND:'+d+'T013000Z','SUMMARY:小μ'+r.scope+'驱虫提醒','BEGIN:VALARM','TRIGGER:-P'+(state.care?.leadDays??3)+'D','ACTION:DISPLAY','DESCRIPTION:小μ的驱虫日快到了','END:VALARM','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:今天记得给小μ驱虫','END:VALARM','END:VEVENT');}lines.push('END:VCALENDAR');download('小μ驱虫提醒.ics',lines.join('\r\n')+'\r\n','text/calendar;charset=utf-8');}
$('#close-album').onclick=()=>$('#album-editor').close();$('#photo-upload').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)void uploadPhotos(fs);};
document.addEventListener('click',e=>{const el=e.target.closest('[data-care],[data-album-id],[data-album-open],[data-slide],[data-album-step],[data-upload-photo],[data-delete-photo],[data-undo-photo]');if(el){if(el.hasAttribute('data-care'))openCare();else if(el.hasAttribute('data-album-id'))openAlbum(el.dataset.albumId);else if(el.hasAttribute('data-album-open'))openAlbum();else if(el.hasAttribute('data-slide')){albumIndex=+el.dataset.slide;$('#hero-slider').scrollTo({left:albumIndex*$('#hero-slider').clientWidth,behavior:'smooth'});}else if(el.hasAttribute('data-album-step')){albumIndex=(albumIndex+(+el.dataset.albumStep)+state.photos.length)%state.photos.length;renderAlbum();}else if(el.hasAttribute('data-upload-photo'))$('#photo-upload').click();else if(el.hasAttribute('data-delete-photo')){if(commit(M.removePhoto(state,el.dataset.deletePhoto))){render();renderAlbum();}}else if(el.hasAttribute('data-undo-photo')){if(commit(M.undoPhoto(state))){render();renderAlbum();}}return;}if(e.target.id==='family-share')void familyShare();if(e.target.id==='calendar-export')exportCalendar();});
document.addEventListener('scroll',e=>{if(e.target.id==='hero-slider'){albumIndex=Math.round(e.target.scrollLeft/e.target.clientWidth);document.querySelectorAll('[data-slide]').forEach((d,i)=>d.classList.toggle('selected',i===albumIndex));}},true);
</script></body></html>
